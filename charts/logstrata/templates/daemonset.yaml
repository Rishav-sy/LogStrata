{{- if .Values.daemon.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "logstrata.fullname" . }}-daemon
  labels:
    {{- include "logstrata.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
  annotations:
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  selector:
    matchLabels:
      {{- include "logstrata.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "logstrata.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
      annotations:
        {{- toYaml .Values.daemon.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "logstrata.serviceAccountName" . }}
      {{- if .Values.daemon.priorityClassName }}
      priorityClassName: {{ .Values.daemon.priorityClassName }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.daemon.tolerations | nindent 8 }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: daemon
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy | default "IfNotPresent" }}
          command: ["/app/logstrata-daemon"]
          args:
            - "--listen-addr={{ .Values.daemon.args.listenAddr }}"
            - "--min-replicas={{ .Values.daemon.args.minReplicas }}"
            - "--max-replicas={{ .Values.daemon.args.maxReplicas }}"
            - "--target-rps-per-pod={{ .Values.daemon.args.targetRPSPerPod }}"
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Container-level security context (hardened)
          securityContext:
            {{- toYaml .Values.daemon.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
{{- end }}
