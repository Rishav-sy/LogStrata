apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: logautoscalerpolicies.core.logstrata.io
spec:
  group: core.logstrata.io
  names:
    kind: LogAutoscalerPolicy
    listKind: LogAutoscalerPolicyList
    plural: logautoscalerpolicies
    singular: logautoscalerpolicy
    shortNames:
      - lap
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - scaleTargetRef
                - minReplicas
                - maxReplicas
              properties:
                scaleTargetRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                minReplicas:
                  type: integer
                  minimum: 1
                maxReplicas:
                  type: integer
                  minimum: 1
                rules:
                  type: array
                  items:
                    type: object
                    required:
                      - metric
                      - threshold
                    properties:
                      metric:
                        type: string
                      threshold:
                        type: number
                      window:
                        type: string
                      action:
                        type: string
                security:
                  type: object
                  properties:
                    lockScaleDownOnThreat:
                      type: boolean
                    autoBlockMaliciousIPs:
                      type: boolean
                    threatThreshold:
                      type: number
            status:
              type: object
              properties:
                currentReplicas:
                  type: integer
                desiredReplicas:
                  type: integer
                lastScaleTime:
                  type: string
                  format: date-time
                activeThreatLevel:
                  type: string
