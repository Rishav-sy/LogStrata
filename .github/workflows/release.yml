name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/logstrata
  CHART_DIR: charts/logstrata

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and push multi-arch Docker images to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker-release:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: daemon
            dockerfile: cmd/logstrata-daemon/Dockerfile
            image: logstrata-daemon
          - name: controller
            dockerfile: cmd/logstrata-controller/Dockerfile
            image: logstrata-controller
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.component.name }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy scan on pushed image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.image }}:${{ steps.version.outputs.VERSION }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Package and publish Helm chart to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  helm-release:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [docker-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}/" ${{ env.CHART_DIR }}/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ github.ref_name }}\"/" ${{ env.CHART_DIR }}/Chart.yaml

      - name: Helm lint (pre-release check)
        run: helm lint ${{ env.CHART_DIR }} --strict

      - name: Package Helm chart
        run: |
          mkdir -p .helm-releases
          helm package ${{ env.CHART_DIR }} --destination .helm-releases/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm repo index
        run: |
          cp .helm-releases/*.tgz gh-pages/
          helm repo index gh-pages/ --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          cd gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "chore(helm): release logstrata-${{ steps.version.outputs.VERSION }}.tgz"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Create GitHub Release with artifacts + changelog
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [helm-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build release binaries (linux + darwin + windows)
        run: |
          mkdir -p dist
          for OS in linux darwin windows; do
            for ARCH in amd64 arm64; do
              EXT=""
              [[ "$OS" == "windows" ]] && EXT=".exe"
              for BIN in logstrata-daemon logstrata-controller logstrata-cli; do
                OUT="dist/${BIN}-${OS}-${ARCH}${EXT}"
                CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH \
                  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }}" \
                  -trimpath -o "$OUT" "./cmd/${BIN}"
                gzip -9 "$OUT" 2>/dev/null || true
              done
            done
          done

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes from git log
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" | head -50)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" | head -30)
          fi
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LogStrata ${{ github.ref_name }}"
          body: |
            ## LogStrata ${{ github.ref_name }}

            Log-Driven Kubernetes Autoscaling & Active Threat Mitigation.

            ### Quick Install
            ```bash
            curl -fsSL https://logstrata.io/install.sh | sh
            # or via Helm:
            helm repo add logstrata https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
            helm install logstrata logstrata/logstrata --namespace logstrata --create-namespace
            ```

            ### Docker Images
            ```bash
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-daemon:${{ steps.version.outputs.VERSION }}
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-controller:${{ steps.version.outputs.VERSION }}
            ```

            ### What's Changed
            ${{ steps.release_notes.outputs.NOTES }}

            ---
            See [PRODUCTION.md](https://github.com/${{ github.repository }}/blob/main/PRODUCTION.md) for the full deployment guide.
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: true
