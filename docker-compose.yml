services:
  logstrata-playground:
    build:
      context: .
      dockerfile: Dockerfile
    image: rishavsy/logstrata-playground:latest
    container_name: logstrata-playground
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
